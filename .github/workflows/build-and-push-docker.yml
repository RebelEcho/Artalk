name: Build & Push Docker Image (fork)

# 自定义 fork 构建流程：修改源码 push 后自动构建 Docker 镜像并推送 ghcr.io
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/artalk-fork

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT_HASH=${{ github.sha }}
