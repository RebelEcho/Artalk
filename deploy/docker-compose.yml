services:
  artalk:
    image: ghcr.io/rebelecho/artalk-fork:latest
    container_name: artalk
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
      - ./artalk.yml:/data/artalk.yml
    ports:
      - "23366:23366"
    command: server --host 0.0.0.0 --port 23366
